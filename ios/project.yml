# XcodeGen spec for the DORM-E iPhone app. On a Mac:  brew install xcodegen && xcodegen && open DORME.xcodeproj
# Generated and compiled in CI (.github/workflows/ios.yml); the UI tests run there in the iOS Simulator.
name: DORME
options:
  bundleIdPrefix: local.dorme          # change to your own reverse-DNS prefix before signing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  DORMEKit:
    path: DORMEKit
targets:
  DORME:
    type: application
    platform: iOS
    sources:
      - path: DORME
    dependencies:
      - package: DORMEKit
    info:
      path: DORME/Info.plist
      properties:
        CFBundleDisplayName: DORM-E
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)   # CI sets it to the GitHub run number for TestFlight
        ITSAppUsesNonExemptEncryption: false          # export compliance: plain HTTP on the LAN, no own crypto
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: DORM-E uses Bluetooth to find your robot nearby, read its basic status and send Stop.
        NSLocalNetworkUsageDescription: DORM-E finds and connects to your robot on your Wi-Fi.
        NSBonjourServices: [_dorme._tcp]
        NSCameraUsageDescription: DORM-E scans the pairing code shown on your robot's screen.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Remote access through Tailscale: its 100.64.0.0/10 addresses and *.ts.net names (plain HTTP inside the
          # encrypted tailnet).
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
            100.64.0.0/10:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.dorme.app   # CI overrides with the repo variable BUNDLE_ID
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""            # set your Apple developer team to run on a phone
  DORMEUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DORMEUITests
    dependencies:
      - target: DORME
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.dorme.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: DORME
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  DORME:
    build:
      targets:
        DORME: all
        DORMEUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DORMEUITests
